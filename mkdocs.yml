site_name: webhooks-101
site_description: A hands-on guide to webhooks — signing, delivery, retries — with a working playground that is both provider and receiver.
repo_url: https://github.com/nitinkc/webhooks
repo_name: nitinkc/webhooks
site_url: https://nitinkc.github.io/webhooks/

theme:
  name: material
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top # Back-to-top button
    - navigation.footer # Prev/Next page links
    # navigation.instant disabled — breaks live reload (re-enable for production builds)
    # - navigation.instant
    # - navigation.instant.progress
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate # (1) style code annotations
    - content.tabs.link # Sync tabs across page
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - mkdocs_quiz
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      guess_lang: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: On this page
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: docs
  - tables

nav:
  - Home: index.md
  - Dashboard: dashboard.md
  - Concepts:
      - "The players: who is the subscriber": concepts/roles.md
      - "Anatomy of a delivery": concepts/anatomy.md
      - "Alternatives to webhooks": concepts/delivery-options.md
      - Receiving webhooks: receiving.md
      - Sending webhooks: sending.md
      - Security: security.md
      - Exposing your server: exposing.md
  - Tools: tools.md
  - Exercises: exercises.md
