syntax = "proto3";

package eventbus.v1;

// A minimal event bus over gRPC:
//
//   Subscribe  — server-streaming RPC: the open call IS the subscription
//   SendEvent  — unary RPC: one event in, one response back
//
// Regenerate the Python stubs after editing:
//
//   uv run python -m grpc_tools.protoc -I. \
//       --python_out=. --grpc_python_out=. eventbus/events.proto

service EventBus {
  // One event in, one response out — the ordinary request/response RPC.
  rpc SendEvent(SendEventRequest) returns (SendEventResponse);

  // The call IS the subscription: keep it open and the server keeps
  // streaming events to you.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message Event {
  string id = 1;         // "evt_..."
  string type = 2;       // e.g. "order.created"
  string created_at = 3; // ISO-8601 UTC
  string data_json = 4;  // payload, exactly like a webhook's "data" object
}

message SendEventRequest {
  string type = 1;
  string data_json = 2;
}

message SendEventResponse {
  Event event = 1;
  int32 delivered_to = 2; // how many Subscribe streams it was pushed onto
}

message SubscribeRequest {
}
