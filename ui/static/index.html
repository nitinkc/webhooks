<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grpc-101 · EventBus</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #2a2f3a; --text: #e6e8ee;
    --muted: #8b93a3; --accent: #58a6ff; --green: #3fb950; --red: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  .pill {
    margin-left: auto; font-size: 12px; padding: 4px 10px;
    border-radius: 999px; border: 1px solid var(--border); font-family: var(--mono);
  }
  .pill.ok { color: var(--green); border-color: var(--green); }
  .pill.bad { color: var(--red); border-color: var(--red); }
  main {
    display: grid; grid-template-columns: 360px 1fr; gap: 16px;
    padding: 16px 24px; max-width: 1100px; margin: 0 auto;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  .card h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-family: var(--mono); font-size: 13px;
  }
  textarea { resize: vertical; min-height: 80px; }
  button {
    margin-top: 14px; width: 100%; padding: 10px;
    background: var(--accent); color: #0b1220; border: 0;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; font-family: var(--mono); white-space: pre-wrap; }
  .sub-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sub-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .sub-bar .dot.on { background: var(--green); }
  .sub-bar span { font-size: 13px; color: var(--muted); }
  .sub-bar button { width: auto; margin: 0 0 0 auto; padding: 6px 14px; font-size: 12px; }
  #feed { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .evt {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    animation: pop .15s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .evt .row1 { display: flex; gap: 10px; align-items: baseline; font-family: var(--mono); font-size: 13px; }
  .evt .type { color: var(--accent); font-weight: 600; }
  .evt .id { color: var(--muted); }
  .evt .time { margin-left: auto; color: var(--muted); font-size: 11px; }
  .evt pre {
    margin: 8px 0 0; font-family: var(--mono); font-size: 12px;
    color: var(--muted); white-space: pre-wrap; word-break: break-word;
  }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>grpc-101 · EventBus</h1>
  <span class="sub">SendEvent (unary) + Subscribe (server-streaming)</span>
  <span id="grpc-pill" class="pill bad">gRPC …</span>
</header>
<main>
  <section class="card">
    <h2>Send an event — unary RPC</h2>
    <label for="type">event type</label>
    <input id="type" value="order.created">
    <label for="data">data_json (payload)</label>
    <textarea id="data">{"order_id": 42, "total": "9.99"}</textarea>
    <button id="send">SendEvent →</button>
    <div id="send-result" class="hint"></div>
  </section>
  <section class="card">
    <div class="sub-bar">
      <div id="sub-dot" class="dot"></div>
      <span id="sub-status">Subscribe stream closed</span>
      <button id="toggle-sub">Subscribe</button>
    </div>
    <h2>Live stream — server-streaming RPC</h2>
    <div id="feed"><div class="empty">Subscribe to see events flow in as they're sent.</div></div>
  </section>
</main>
<script>
const feed = document.getElementById('feed');
const pill = document.getElementById('grpc-pill');
const dot = document.getElementById('sub-dot');
const subStatus = document.getElementById('sub-status');
const toggleBtn = document.getElementById('toggle-sub');
let ws = null, subscribed = false, sawEvent = false;

async function checkHealth() {
  try {
    const h = await fetch('/api/health').then(r => r.json());
    pill.textContent = h.grpc === 'connected' ? `gRPC ✓ ${h.addr}` : `gRPC unreachable ${h.addr}`;
    pill.className = 'pill ' + (h.grpc === 'connected' ? 'ok' : 'bad');
  } catch { pill.textContent = 'bridge error'; pill.className = 'pill bad'; }
}
checkHealth(); setInterval(checkHealth, 5000);

function addEvent(e) {
  if (!sawEvent) { feed.innerHTML = ''; sawEvent = true; }
  let pretty = e.data_json;
  try { pretty = JSON.stringify(JSON.parse(e.data_json), null, 2); } catch {}
  const div = document.createElement('div');
  div.className = 'evt';
  div.innerHTML =
    `<div class="row1"><span class="type"></span><span class="id"></span><span class="time"></span></div><pre></pre>`;
  div.querySelector('.type').textContent = e.type;
  div.querySelector('.id').textContent = e.id;
  div.querySelector('.time').textContent = e.created_at.replace('T', ' ').replace('+00:00', 'Z');
  div.querySelector('pre').textContent = pretty;
  feed.prepend(div);
}

function setSub(on) {
  subscribed = on;
  dot.className = 'dot' + (on ? ' on' : '');
  subStatus.textContent = on ? 'Subscribed — stream open' : 'Subscribe stream closed';
  toggleBtn.textContent = on ? 'Unsubscribe' : 'Subscribe';
}

function subscribe() {
  ws = new WebSocket(`ws://${location.host}/ws/subscribe`);
  ws.onopen = () => setSub(true);
  ws.onmessage = m => addEvent(JSON.parse(m.data));
  ws.onclose = () => { setSub(false); ws = null; };
}
function unsubscribe() { if (ws) ws.close(); }
toggleBtn.onclick = () => (subscribed ? unsubscribe() : subscribe());

document.getElementById('send').onclick = async () => {
  const body = {
    type: document.getElementById('type').value,
    data_json: document.getElementById('data').value,
  };
  const res = await fetch('/api/events', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  }).then(r => r.json());
  const out = document.getElementById('send-result');
  out.textContent = res.ok
    ? `→ ${res.event.id} delivered_to=${res.delivered_to} stream(s)`
    : `✗ ${res.error}`;
};

subscribe(); // open the stream on load — the stream IS the subscription
</script>
</body>
</html>
